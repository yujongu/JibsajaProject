name: jibsaja
description: "Privacy-first personal finance tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App launcher icon generation. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Android adaptive icon (API 26+): layered background + foreground.
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # iOS icons must be opaque; icon.png already has a solid background.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
